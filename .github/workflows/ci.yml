name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  api:
    name: API (Fastify + Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pompom
          POSTGRES_PASSWORD: pompom
          POSTGRES_DB: pompom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/api
        run: bun run prisma:generate

      - name: Lint
        working-directory: apps/api
        run: bun run lint

      - name: Tests (vitest + Postgres réel)
        working-directory: apps/api
        run: bun run test

      - name: Build (tsc)
        working-directory: apps/api
        run: bun run build

  web:
    name: Web (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Tests (vitest + jsdom)
        working-directory: apps/web
        run: bun run test

      - name: Build (tsc + vite)
        working-directory: apps/web
        run: bun run build

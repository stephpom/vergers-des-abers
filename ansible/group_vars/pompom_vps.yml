---
# Variables publiques (non sensibles, committées en clair).
# Les valeurs sensibles vont dans pompom_vps_vault.yml (chiffré).

app_user: deploy
app_dir: /opt/pompom
repo_url: "git@github.com:stephpom/happy-apple-shop.git"
git_branch: main

# Domaine principal (à adapter au moment de l'achat du domaine).
# Peut aussi être overridé via la variable d'env DEPLOY_HOST côté CI.
domain: vergersdesabers.fr
api_subdomain: api

# Chemin de la deploy key SSH GitHub côté VPS (déposée par setup.yml).
github_deploy_key_dest: "/home/{{ app_user }}/.ssh/github_deploy_key"

# Clé PUBLIQUE du runner GitHub Actions (la clé PRIVÉE est dans le Vault :
# deploy_ssh_private_key). Installée dans authorized_keys de deploy par setup.yml.
deploy_authorized_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK1+TpcH9SXY1YMdorBbqvzeFxthxS2AGJqa4BN5+2sI github-actions-pompom-ci"

# Health check après deploy
health_check_url: "https://{{ api_subdomain }}.{{ domain }}/health"
health_check_retries: 15
health_check_delay: 3

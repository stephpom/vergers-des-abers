---
# Inventaire YAML (supporte Jinja2 dans les valeurs).
# ansible_host est résolu depuis la variable d'env DEPLOY_HOST (CI ou local).
# La clé SSH privée est fournie via --private-key (CI: ~/.ssh/deploy_key ;
# local: la clé de l'opérateur), PAS figée ici, pour rester cohérent partout.

all:
  children:
    pompom_vps:
      hosts:
        prod:
          ansible_host: "{{ lookup('env', 'DEPLOY_HOST') | default('vergersdesabers.fr', true) }}"
          ansible_user: deploy
      vars:
        ansible_python_interpreter: /usr/bin/python3

---
# Deploy de pompom-shop sur le VPS.
# Lancé automatiquement par GitHub Actions sur push main (cf. .github/workflows/ci.yml).
# Peut aussi être lancé manuellement depuis ton poste :
#
#   ansible-playbook -i ansible/inventory.yml ansible/deploy.yml --ask-vault-password
#
# Pré-requis : setup.yml exécuté au moins une fois (provisioning effectif).

# Play 1 : matérialise la clé SSH privée du runner (stockée dans le Vault
# chiffré) dans ~/.ssh/deploy_key, utilisée ensuite via --private-key.
# Évite d'avoir un secret GitHub DEPLOY_SSH_KEY : seul ANSIBLE_VAULT_PASSWORD suffit.
- name: Préparer la clé SSH de déploiement (depuis le Vault)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/pompom_vps_vault.yml
  tasks:
    - name: S'assurer que ~/.ssh existe
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"

    - name: Écrire la clé privée du runner (CI → deploy@VPS)
      ansible.builtin.copy:
        content: "{{ deploy_ssh_private_key }}"
        dest: "{{ lookup('env', 'HOME') }}/.ssh/deploy_key"
        mode: "0600"

- name: Déployer pompom-shop
  hosts: pompom_vps
  become: false
  vars_files:
    - group_vars/pompom_vps_vault.yml

  tasks:
    - name: Pull dernière version main
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: true
        accept_hostkey: true

    - name: Mettre à jour .env (au cas où rotation de clés dans le Vault)
      ansible.builtin.copy:
        content: "{{ env_production }}"
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Mettre à jour la configuration Caddy
      become: true
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        validate: caddy validate --config %s
      notify: Recharger Caddy

    - name: Build + restart docker compose (rolling)
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml up -d --build
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Migration Prisma (deploy)
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml exec -T api bun run prisma:migrate:deploy
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Health check API (retry)
      ansible.builtin.uri:
        url: "{{ health_check_url }}"
        status_code: 200
      register: health
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      until: health.status == 200

  handlers:
    - name: Recharger Caddy
      become: true
      ansible.builtin.service:
        name: caddy
        state: reloaded

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;

    # Cache statique
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff2?|ttf|eot|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — toutes les routes non-fichier renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (le reverse proxy Caddy peut aussi les ajouter, doublon inoffensif)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # - 'unsafe-inline' sur style-src requis par shadcn/Tailwind (variables CSS inline)
    # - frame-src www.google.com + maps.google.com requis par l'iframe Google Maps
    #   (l'embed maps.google.com/maps?output=embed peut rediriger vers www.google.com)
    # - img-src *.tile.openstreetmap.org requis par le fond de carte Leaflet
    # - connect-src doit matcher le domaine API réel (VITE_API_URL)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.vergersdesabers.fr https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.vergersdesabers.fr; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

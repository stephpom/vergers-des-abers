# docker-compose.yml — DEV ONLY
#
# Lance : docker compose up
# Premier run : docker compose exec api bun run prisma:migrate && bun run prisma:seed
#
# Configuration via .env optionnel à la racine — voir .env.example.
# Sans .env, les défauts ci-dessous suffisent pour démarrer immédiatement.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pompom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pompom}
      POSTGRES_DB: ${POSTGRES_DB:-pompom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pompom} -d ${POSTGRES_DB:-pompom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base dédiée aux tests d'intégration backend.
  # Valeurs volontairement en dur : doivent rester alignées avec apps/api/.env.test.
  db_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pompom
      POSTGRES_PASSWORD: pompom
      POSTGRES_DB: pompom_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pompom -d pompom_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pompom}:${POSTGRES_PASSWORD:-pompom}@db:5432/${POSTGRES_DB:-pompom}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_secret_not_for_prod_at_least_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: development
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /app/apps/api/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pompom.fr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-pompom_dev_admin}
    ports:
      - "3001:3001"
    volumes:
      # Bind-mount des DOSSIERS plutôt que de fichiers individuels (sinon les éditeurs avec
      # atomic-write cassent le mount Docker sur macOS et les changements ne se propagent pas).
      - ./apps/api:/app/apps/api
      - ./apps/web/package.json:/app/apps/web/package.json
      - ./package.json:/app/package.json
      - ./bun.lockb:/app/bun.lockb
      # Volumes nommés (priorité sur le bind du parent) pour isoler node_modules
      - api_node_modules:/app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Côté client (browser) : vide → fetch sur path relatif `/api/...` qui transite par le proxy Vite
      VITE_API_URL: ""
      # Côté Vite (proxy server-side, dans le container web) : cible le service api via le DNS Docker
      API_PROXY_TARGET: http://api:3001
      VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:5173}
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount du DOSSIER apps/web entier (atomic-write safe sur macOS) ;
      # le volume nommé node_modules ci-dessous écrase ce sous-dossier.
      - ./apps/web:/app/apps/web
      - ./apps/api/package.json:/app/apps/api/package.json
      - ./package.json:/app/package.json
      - ./bun.lockb:/app/bun.lockb
      - web_node_modules:/app/apps/web/node_modules

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
